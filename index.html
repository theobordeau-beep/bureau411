<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Site</title>
    <style>
        body { 
            margin: 0; 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        img.main-image { 
            max-width: 100%; 
            max-height: 80vh; 
            object-fit: contain; 
        }
        .insta-icon { 
            margin-top: 20px; 
            width: 40px; 
            height: 40px; 
            color: #000;
            transition: opacity 0.2s;
        }
        .insta-icon:hover { 
            opacity: 0.6; 
        }
    </style>
</head>
<body>
    <!-- Ton image principale -->
    <img src="image.jpg" alt="Accueil" class="main-image">

    <!-- Logo Instagram cliquable -->
    <a href="https://www.instagram.com/bureau_411/" target="_blank" aria-label="Instagram">
        <svg class="insta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
    </a>
</body>
</html>
