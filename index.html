<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Site</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: #fff;
            overflow: hidden; /* Bloque tout défilement (plus de droite/gauche ni haut/bas) */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            max-height: 100vh;
            padding: 20px;
        }
        img.main-image { 
            max-width: 100%; 
            max-height: calc(100vh - 120vh); /* S'adapte à l'écran sans déborder */
            height: auto;
            object-fit: contain; 
        }
        .insta-icon { 
            margin-top: 15px; 
            width: 36px; 
            height: 36px; 
            color: #000;
            transition: opacity 0.2s;
        }
        .insta-icon:hover { 
            opacity: 0.6; 
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image.jpg" alt="Accueil" class="main-image">

        <a href="https://www.instagram.com/bureau_411/" target="_blank" aria-label="Instagram">
            <svg class="insta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        </a>
    </div>
</body>
</html>
